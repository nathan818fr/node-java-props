# Values and keys spanning several lines
greeting = Hello, \
           World!
path=/usr/local/bin:\
     /usr/bin:\
     /bin

indented.key\
    .continued = value
  indented.entry = first \
		  second
whitespace.kinds = one\
 	 two
unicode.across.lines = caf\
    \u00e9 au lait
escape.across.lines = tab\
    \tseparated

# An even number of backslashes doesn't continue the line
windows.dir = C:\\Program Files\\
after.windows.dir = not part of the previous value
odd.backslashes = a\\\
    b

# Continuation lines are never comments
hash.continuation = start\
    # not a comment
bang.continuation = start\
    ! not a comment

key\ with\ spaces = value with trailing spaces   
empty.value =
only.key
last = end
